<!DOCTYPE html>
<!-- code by tanay ranka sycse b 8      -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expiriment no. 3 String operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fontdiner+Swanky&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      background-color: #000;
      height: 100vh;
      width: 100vw;
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-weight: 300;
      font-style: normal;
      display: flex;
      justify-content: center;
    }
    .con{
      height: min-content;
      margin-top: 6rem;
      padding: 3rem;
      min-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid #fff;
      border-radius: 23px;
      gap: 1rem;
      background-image: linear-gradient(to bottom right,#30CFD0, #330867);
    }
    h2{
      transform: translateY(-1rem);
    }
  </style>
</head>
<body>
  
  <div class="con">
    <h2>String: <span id="gg"></span></h2>
    <h3 id="io"></h3>
    <h3 id="io1"></h3>
    <h3 id="io2"></h3>
    <h3 id="io3"></h3>
    <h3 id="io4"></h3>
    <h3 id="io5"></h3>
    <h3 id="io6"></h3>
  </div>


  <script defer>
    // code by tanay ranka sycse b 8
    const con = document.querySelector(".con");
    const h = document.getElementById("io");
    const sp = document.getElementById("gg");
    let t = prompt("Enter a string: ");
    let te = prompt("Entre second string: ");
    let strng = t + te;
    let consttr = new String("Hello wolrfd");    // strings using constructors..
    sp.innerText = strng;
    h.innerText = `Length is: ${strng.length}`;
    document.getElementById("io1").innerText = `Uppercase: ${t.toUpperCase()}`;
    document.getElementById("io2").innerText = `Lowercase: ${t.toLocaleLowerCase()}`;
    document.getElementById("io3").innerText = `Substring: ${t.substring(0, 5)}`;
    document.getElementById("io4").innerText = `IndexOf 'mit': ${t.indexOf("mit")}`;
    document.getElementById("io5").innerText = `Concatenated str: ${strng}`;
    document.getElementById("io6").innerText= `Replaced str: ${strng.replace("mit", "university")}`;
  </script>

</body>
</html>
